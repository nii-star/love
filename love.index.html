
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Love Me? ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffe0ec, #ffc2d8, #fff0f5);
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
    padding: 25px 12px;
}

/* Kartu utama */
.container {
    position: relative;
    z-index: 2;
    background: white;
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 10px 35px #e7548090;
    text-align: center;
    width: 100%;
    max-width: 480px;
}

h1 {
    color: #ed4b85;
    font-size: 28px;
}

h2 {
    color: #ed4b85;
    font-size: 30px;
    margin-bottom: 10px;
}

p {
    color: #777;
}

/* Tombol */
.buttons {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    margin-top: 30px;
    min-height: 55px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 13px 28px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.25s ease;
}

#yesBtn {
    background: #ff5c9a;
    color: white;
    transform: scale(1);
    position: relative;
    z-index: 2;
}

#noBtn {
    background: #eeeeee;
    color: #555;
    position: relative;
    z-index: 3;
}

/* Bagian sukses */
#success {
    display: none;
    animation: fadeIn 1s ease;
}

.love-message {
    color: #ed4b85;
    font-size: 18px;
    font-weight: bold;
}

/* Galeri 3 foto */
.photo-gallery {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 22px auto;
    width: 100%;
}

.couple-photo {
    width: 31%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    border-radius: 16px;
    border: 4px solid #ff8db8;
    box-shadow: 0 5px 20px #ff8db866;
    animation: photoPop 1s ease;
}

.love-caption {
    color: #ed4b85;
    font-size: 15px;
    font-style: italic;
    margin-top: 15px;
}

/* Tombol replay */
#replayBtn {
    background: #ff8db8;
    color: white;
    margin-top: 20px;
}

/* Animasi */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes photoPop {
    from {
        opacity: 0;
        transform: scale(0.5);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* Hati beterbangan */
.heart {
    position: fixed;
    bottom: -30px;
    font-size: 22px;
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }
    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Kembang api */
#fireworks {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

/* Tampilan HP */
@media (max-width: 480px) {
    .container {
        padding: 28px 15px;
    }

    h1 {
        font-size: 23px;
    }

    h2 {
        font-size: 25px;
    }

    .buttons {
        gap: 12px;
    }

    button {
        padding: 12px 22px;
        font-size: 15px;
    }

    .photo-gallery {
        gap: 7px;
    }

    .couple-photo {
        width: 31%;
        border-width: 3px;
        border-radius: 12px;
    }
}
</style>
</head>

<body>

<canvas id="fireworks"></canvas>

<div class="container">

    <!-- HALAMAN PERTANYAAN -->
    <div id="question">

        <h1 id="questionText">
            Do you love me? 🥺👉👈
        </h1>

        <p>Please answer honestly... 💗</p>

        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">
                YES ❤️
            </button>

            <button id="noBtn" onclick="sayNo()">
                NO 😭
            </button>
        </div>

    </div>

    <!-- HALAMAN JIKA YES -->
    <div id="success">

        <h2>YAYYYYY!! 🎉💗</h2>

        <h2>I LOVE YOU TOO!! ❤️</h2>

        <p class="love-message">
            You are my favorite person in the whole world 🥰
        </p>

        <!-- GANTI NAMA FOTO SESUAI FOTO KAMU -->
        <div class="photo-gallery">

            <img src="ft1.jpeg"
                 alt="Foto pertama"
                 class="couple-photo">

            <img src="ft2.jpeg"
                 alt="Foto kedua"
                 class="couple-photo">

            <img src="ft3.jpeg"
                 alt="Foto ketiga"
                 class="couple-photo">

        </div>

        <p class="love-caption">
            Every moment with you is my favorite memory ❤️
        </p>

        <button id="replayBtn" onclick="replay()">
            PLAY AGAIN 💕
        </button>

    </div>

</div>

<script>
let noCount = 0;
let yesScale = 1;

const questions = [
    "Do you love me? 🥺👉👈",
    "Are you sure? 🥺",
    "You really don't love me? 😭",
    "Really?? Hiks... 💔🥹"
];

const questionText = document.getElementById("questionText");
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const question = document.getElementById("question");
const success = document.getElementById("success");

/* Tombol NO */
function sayNo() {

    noCount++;

    if (noCount < 4) {
        questionText.innerText = questions[noCount];
    } else {
        questionText.innerText = "PLEASEEEE SAY YES!! 🥺💗";
    }

    // Membesarkan tombol YES
    yesScale += 0.5;
    yesBtn.style.transform = `scale(${yesScale})`;

    // Setelah 4 kali klik, tombol NO kabur
    if (noCount >= 4) {
        noBtn.style.position = "fixed";
        noBtn.style.left = "50%";
        noBtn.style.top = "70%";
        noBtn.style.transform = "translate(-50%, -50%)";
    }
}

/* Tombol NO kabur saat didekati */
function runAway() {

    if (noCount >= 4) {

        const maxX = window.innerWidth - noBtn.offsetWidth - 20;
        const maxY = window.innerHeight - noBtn.offsetHeight - 20;

        const randomX = Math.max(10, Math.random() * maxX);
        const randomY = Math.max(10, Math.random() * maxY);

        noBtn.style.left = randomX + "px";
        noBtn.style.top = randomY + "px";
        noBtn.style.transform = "none";
    }
}

noBtn.addEventListener("mouseover", runAway);

noBtn.addEventListener("touchstart", function(e) {
    if (noCount >= 4) {
        e.preventDefault();
        runAway();
    }
});

/* Jika YES diklik */
function sayYes() {

    question.style.display = "none";
    success.style.display = "block";

    startFireworks();
    createHearts();
}

/* Tombol replay */
function replay() {

    noCount = 0;
    yesScale = 1;

    questionText.innerText = questions[0];

    yesBtn.style.transform = "scale(1)";

    noBtn.style.position = "relative";
    noBtn.style.left = "";
    noBtn.style.top = "";
    noBtn.style.transform = "";

    success.style.display = "none";
    question.style.display = "block";

    stopFireworks();
}

/* Membuat hati beterbangan */
function createHearts() {

    const heartInterval = setInterval(() => {

        if (success.style.display === "none") {
            clearInterval(heartInterval);
            return;
        }

        const heart = document.createElement("div");

        heart.className = "heart";

        const heartTypes = ["❤️", "💗", "💕", "💖", "💘"];
        heart.innerText =
            heartTypes[Math.floor(Math.random() * heartTypes.length)];

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);

    }, 300);
}

/* ANIMASI KEMBANG API */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

let particles = [];
let fireworksRunning = false;
let animationId;

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

function createFirework() {

    const x = Math.random() * canvas.width;
    const y = Math.random() * canvas.height * 0.6;

    const colors = [
        "#ff4d94",
        "#ffcc00",
        "#ff66cc",
        "#ffffff",
        "#ff6699"
    ];

    const color = colors[
        Math.floor(Math.random() * colors.length)
    ];

    for (let i = 0; i < 45; i++) {

        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 1;

        particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color: color
        });
    }
}

function animateFireworks() {

    if (!fireworksRunning) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (Math.random() < 0.05) {
        createFirework();
    }

    particles.forEach((p, index) => {

        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.012;

        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();

        if (p.alpha <= 0) {
            particles.splice(index, 1);
        }
    });

    ctx.globalAlpha = 1;

    animationId = requestAnimationFrame(animateFireworks);
}

function startFireworks() {

    if (fireworksRunning) return;

    fireworksRunning = true;
    animateFireworks();
}

function stopFireworks() {

    fireworksRunning = false;

    cancelAnimationFrame(animationId);

    particles = [];

    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

</script>

</body>
</html>
